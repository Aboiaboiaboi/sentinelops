# Continuous integration, and — on a version tag only — publication.
#
# This file is also a finding SentinelOps reports about itself: the deployment
# scanner's `ci` check looks for exactly `.github/workflows/`, and its absence
# cost this project 4 points on every self-scan. Fixing it here is the project
# taking its own advice, which is the only honest way to ship a tool like this.
#
# Three test jobs, deliberately independent so a frontend typo does not hide a
# backend failure behind a cancelled run. Each one reproduces a command that
# already exists locally — nothing here is a CI-only invocation, because a check
# a developer cannot run before pushing is a check they will learn to ignore.
#
# The fourth job publishes, and lives here rather than in a release.yml of its
# own for one reason: `needs:` is the only mechanism GitHub offers that
# *guarantees* an image is never pushed from a tag whose tests failed. Across
# two workflow files the options are `workflow_run`, which does not carry the
# tag that triggered it and only fires for workflow files already on the default
# branch, or the convention "only tag a commit that was already green" — which
# is a rule about people, not a gate. A separate file would be tidier and this
# is not a place to buy tidiness with a hole.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default. Any job needing more asks for it locally.
permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant. `main` is
# excluded from cancellation so the history of what passed on it stays complete,
# and tags are excluded because a cancelled tag run is a half-published release
# — the images for one target pushed and the other not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Pinned to the version the runtime image copies from ghcr, so CI resolves
  # dependencies exactly as the build does. An unpinned installer is the same
  # class of problem as an unpinned base image.
  UV_VERSION: "0.11.7"

jobs:
  backend:
    name: Backend — lint, format, tests
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real PostgreSQL rather than SQLite: the schema
      # uses native enums, JSONB and `gen_random_uuid()`, so a substitute would
      # pass tests the production database would fail. conftest creates and
      # drops a `_test` database of its own, which needs the superuser this
      # service provides.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelops
          POSTGRES_PASSWORD: sentinelops
          POSTGRES_DB: sentinelops
        ports:
          - 5432:5432
        # Without this the first test can connect before Postgres is accepting
        # connections, which fails as a confusing timeout rather than as a
        # missing service.
        options: >-
          --health-cmd "pg_isready -U sentinelops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://sentinelops:sentinelops@localhost:5432/sentinelops
      # No ENVIRONMENT here, deliberately. It used to say `test`, which is not a
      # value the setting accepts — `environment` is a Literal of development
      # and production, so Settings() raised at import and conftest could not
      # load. Every backend run failed at collection.
      #
      # The fix is to delete it rather than to add a third literal. A `test`
      # environment would exist only in CI, and the rule at the top of this file
      # is that nothing here is a CI-only invocation. Unset means `development`,
      # which is what the suite runs as locally — so CI now reproduces the local
      # run instead of a mode nobody else ever exercises.
      # Points the Cloud Storage and S3 tests at the emulators started below.
      # Without these they skip, and a skipped test that only ever runs on one
      # developer's machine is decoration.
      STORAGE_EMULATOR_HOST: http://localhost:4443
      S3_ENDPOINT_URL: http://localhost:9000
      # MinIO's own defaults, used only against the local emulator below —
      # never credentials for a real account.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the runtime image. requires-python allows 3.13, but CI
          # should fail where production would.
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install dependencies
        # --frozen fails if uv.lock disagrees with pyproject.toml, so a
        # hand-edited dependency that was never locked breaks here rather than
        # in an image build later.
        #
        # --all-groups, not --all-extras: ruff and pytest live in
        # [dependency-groups], and this project declares no extras at all, so
        # --all-extras would install neither and every check below would fail on
        # a missing command.
        run: uv sync --frozen --all-groups

      - name: Start the Cloud Storage emulator
        # fake-gcs-server implements the real GCS JSON API over HTTP, so the
        # storage tests exercise the SDK rather than a mock of it. Started as a
        # step rather than a `services:` container because it needs command
        # arguments, and `services:` can only set an image, env and ports.
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server:1.52 \
            -scheme http -port 4443 -public-host localhost:4443
          for _ in $(seq 1 20); do
            curl -sf http://localhost:4443/storage/v1/b?project=test >/dev/null && exit 0
            sleep 0.5
          done
          echo "the emulator never came up" >&2
          docker logs fake-gcs >&2
          exit 1

      - name: Start the S3 emulator
        # MinIO implements the real S3 API, so the storage tests exercise
        # boto3 rather than a mock of it — the same reasoning as fake-gcs-server
        # above, and it is also what the same S3Storage class talks to on R2,
        # Spaces or real AWS.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && exit 0
            sleep 0.5
          done
          echo "the emulator never came up" >&2
          docker logs minio >&2
          exit 1

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        # The sandbox integration test runs here rather than skipping: GitHub's
        # runners have a Docker daemon, and it is the one test that proves the
        # containment flags do what every other test asserts they say.
        run: uv run pytest -q

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `ci` rather than `install`: it installs exactly the lockfile and fails
        # if package.json disagrees, where `install` would quietly resolve
        # something newer and make the run unreproducible.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        # `tsc -b` rather than `--noEmit`: the build uses project references,
        # and the two configurations do not check the same files. A type error
        # in a test file was caught by `-b` after `--noEmit` reported clean.
        run: npx tsc -b

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  images:
    name: Images — api and worker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Both targets, because they diverge: the worker carries git and the
      # docker client, the api does not. This job exists because of a real
      # outage — `httpx` was a dev-only dependency imported at runtime, so both
      # images built fine and crashed on start. Building is necessary but not
      # sufficient, hence the import check below.
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: api
          push: false
          load: true
          tags: sentinelops-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: worker
          push: false
          load: true
          tags: sentinelops-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Both images can import their entrypoint
        # The check that would have caught the httpx outage. A missing runtime
        # dependency is invisible to `docker build` and fatal on first start.
        run: |
          docker run --rm --entrypoint python sentinelops-api:ci -c "import app.main"
          docker run --rm --entrypoint python sentinelops-worker:ci -c "import app.workers.settings"

      - name: The worker has the tools it shells out to
        # git for cloning, docker for the sandbox. Both are copied in rather
        # than installed by the base image, so a Dockerfile edit can silently
        # remove them and only fail at scan time.
        run: |
          docker run --rm --entrypoint git sentinelops-worker:ci --version
          docker run --rm --entrypoint docker sentinelops-worker:ci --version

  publish:
    name: Publish — ${{ matrix.target }} to GHCR
    # A version tag and nothing else. Every push to main and every pull request
    # still runs the three jobs above and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    # The gate. Without this the registry could hold an image from a tag whose
    # test suite was red, and "what is deployed" would stop meaning "what
    # passed".
    needs: [backend, frontend, images]
    runs-on: ubuntu-latest

    # Raised only for this job, not at the top of the file. Every other job in
    # here handles code from pull requests, and a token that can write packages
    # has no business being in scope while doing so.
    permissions:
      contents: read
      packages: write

    strategy:
      # The two images diverge — the worker carries git and the docker client —
      # so they are two packages, built in parallel. fail-fast off: one target
      # failing should not cancel the other mid-push and leave the release
      # half-published.
      fail-fast: false
      matrix:
        target: [api, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to manage. GITHUB_TOKEN is minted per run, expires with
          # it, and the `packages: write` above is the whole of what it can do —
          # which is why GHCR is the one registry in this design that needs no
          # federation setup. A personal access token stored as a repository
          # secret would be a long-lived credential doing the same job worse.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        # GHCR rejects an uppercase path, and this account's owner name has a
        # capital in it — so the obvious ghcr.io/${{ github.repository_owner }}
        # fails at push time with a message about an invalid reference rather
        # than about case.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/sentinelops-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Two tags, both immutable. A moving tag makes "which image is running
          # in production" unanswerable after the fact, and it is how a rollback
          # quietly redeploys the thing it was rolling back from. The deploy in
          # milestone 5 references a digest; these exist so a person can find
          # the image.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          # `latest=false` is not redundant, which the first release proved: the
          # action defaults to `latest=auto`, which appends `latest` for any
          # non-prerelease semver tag *regardless of the list above*. v0.51.0
          # published `0.51.0`, `sha-…` and a `latest` nobody asked for, while
          # the comment above claimed there was no such tag. Configuration that
          # disagrees with its own comment is worse than either alone.
          flavor: latest=false

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # OCI labels recording the commit, the source repository and the build
          # time, so the image can say where it came from without a lookup.
          labels: ${{ steps.meta.outputs.labels }}
          # Read-only against the cache the `images` job filled with mode=max
          # earlier in this same run. So this is a cache hit and a push, not a
          # second build — and it must not write, because two matrix legs
          # exporting to the same gha cache scope race each other.
          cache-from: type=gha
          # Off, so what lands under the tag is a plain image manifest rather
          # than an OCI index wrapping the image and a provenance attestation.
          # Nothing consumes an attestation here yet, and an index is the shape
          # that has historically surprised registries and runtimes that expect
          # a single manifest. Worth turning on once something verifies it.
          provenance: false

      - name: Record the digest
        # The digest is what milestone 5 deploys and what a rollback names.
        # Printed into the run summary so it survives as a readable record
        # rather than only inside the registry.
        run: |
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
