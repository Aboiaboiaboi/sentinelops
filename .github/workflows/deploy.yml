# Deploys deploy/compose/docker-compose.prod.yml to the AWS instance
# (deploy/aws/) on every push to main, and rolls back automatically if it
# doesn't come up healthy.
#
# Zero-downtime, measured rather than assumed for both halves:
# - Backend and worker are recreated one at a time, gated on their own
#   healthcheck via `docker compose up --wait`. frontend/Caddyfile's
#   reverse_proxy retries a dropped upstream connection for up to 15s
#   (lb_try_duration) — without that, a rehearsed swap produced ~2.7s of
#   consecutive 502s; with it, zero failed requests across three rehearsals.
# - Frontend (Caddy — the container holding the TLS certificate and the
#   public 80/443 listener) is never rebuilt or recreated by an ordinary
#   push at all. `frontend-build`, a one-shot service, compiles the SPA into
#   a shared volume; Caddy just serves whatever's currently in it. A
#   rehearsed frontend-only change, polled every 50ms through the swap,
#   returned 200 on all 100 requests — the container's own start time never
#   changed. See frontend/Dockerfile and docker-compose.prod.yml's
#   `frontend`/`frontend-build` services for the reasoning.
#
# If the post-deploy health check fails, this workflow runs
# deploy/compose/rollback.sh against .last-good-deploy automatically, so a
# broken push doesn't sit broken until someone notices — the run still ends
# red (visible), it just doesn't leave production down while that's noticed.
# Manual rollback: re-run this workflow from the Actions tab with a `ref`
# input, or SSH in and run rollback.sh directly.
#
# Needs two things configured once, in this repository's Settings → Secrets
# and variables → Actions:
#   Secret   DEPLOY_SSH_KEY  — the private half of deploy/aws's key pair
#   Variable DEPLOY_DOMAIN   — the instance's sslip.io domain (or a real one,
#                              once deploy/aws/README.md's DOMAIN rotation
#                              happens)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Leave empty for a normal deploy of main. Set to a commit or tag to
          roll back to it instead (runs rollback.sh, not a forward deploy).
        required: false
        default: ""

# A second push while a deploy is still running queues behind it rather than
# running concurrently — two deploys racing the same containers is how a
# rollback undoes itself mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_DOMAIN }}" >> ~/.ssh/known_hosts

      - name: Manual rollback (workflow_dispatch with a ref only)
        if: github.event_name == 'workflow_dispatch' && inputs.ref != ''
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@${{ vars.DEPLOY_DOMAIN }}" \
            "cd ~/sentinelops/deploy/compose && ./rollback.sh '${{ inputs.ref }}'"

      - name: Build, migrate, and roll each service behind its healthcheck
        if: "!(github.event_name == 'workflow_dispatch' && inputs.ref != '')"
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@${{ vars.DEPLOY_DOMAIN }}" bash -s <<'REMOTE'
            set -euo pipefail
            cd ~/sentinelops

            git fetch origin main
            git reset --hard origin/main
            DEPLOYED_SHA="$(git rev-parse HEAD)"

            cd deploy/compose
            docker compose -f docker-compose.prod.yml --env-file .env build

            echo "==> Migrating (blocks; a failed migration stops the deploy here,"
            echo "    before anything user-facing changes)"
            docker compose -f docker-compose.prod.yml --env-file .env run --rm migrate

            echo "==> Rolling backend"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps --wait backend

            echo "==> Rolling worker"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps --wait worker

            echo "==> Rebuilding the frontend static files"
            docker compose -f docker-compose.prod.yml --env-file .env run --rm frontend-build

            echo "==> Rolling frontend"
            # Almost always a no-op — see docker-compose.prod.yml's comment on
            # the frontend service. Only recreates the container if Caddyfile
            # itself changed in this push.
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps frontend

            docker image prune -f

            echo "$DEPLOYED_SHA" > .last-good-deploy-candidate
          REMOTE

      - name: Verify the deployed site actually answers
        id: verify
        if: "!(github.event_name == 'workflow_dispatch' && inputs.ref != '')"
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ vars.DEPLOY_DOMAIN }}/api/health" >/dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Site did not answer /api/health after deploy." >&2
          exit 1

      - name: Record this deploy as the last known-good one
        if: success() && !(github.event_name == 'workflow_dispatch' && inputs.ref != '')
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@${{ vars.DEPLOY_DOMAIN }}" \
            "cd ~/sentinelops/deploy/compose && mv .last-good-deploy-candidate .last-good-deploy"

      - name: Deploy failed — rolling back automatically
        # failure() alone, not gated on the verify step specifically: the
        # deploy step itself can fail before verify ever runs (a bad
        # migration, or --wait timing out because backend/worker never goes
        # healthy) and that needs the same rollback as a verify failure does.
        # Excluded from the manual-rollback-only path so a failed rollback
        # does not trigger a second, automatic one on top of itself.
        if: failure() && !(github.event_name == 'workflow_dispatch' && inputs.ref != '')
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@${{ vars.DEPLOY_DOMAIN }}" \
            "cd ~/sentinelops/deploy/compose && ./rollback.sh"
          echo "::error::Deploy failed and was rolled back to the last known-good commit. This run stays red — the failing push still needs fixing before it can go out again."
