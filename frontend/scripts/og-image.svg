<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#1a2a52" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scoreRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c9bf5"/>
      <stop offset="100%" stop-color="#d9a441"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0b10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Faint grid, same texture language as the landing hero -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Mark + wordmark -->
  <g transform="translate(80, 92)">
    <g transform="scale(2.4)">
      <path d="M12 3.2c1.6 1.4 3.7 2.4 5.5 2.4.5 0 1 .4 1 1v5.9c0 4.5-3.1 6.7-6.5 7.9-.2.1-.4.1-.6 0-3.4-1.2-6.5-3.4-6.5-7.9V6.6c0-.6.5-1 1-1 1.8 0 3.9-1 5.5-2.4.3-.3.8-.3 1.1 0z"
            fill="none" stroke="#6c9bf5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m9 12 2 2 4-4" fill="none" stroke="#6c9bf5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="62" y="34" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="600" fill="#f5f6f8" letter-spacing="-0.5">SentinelOps</text>
  </g>

  <!-- Headline -->
  <text x="80" y="270" font-family="Space Grotesk, Arial, sans-serif" font-size="58" font-weight="600" fill="#f5f6f8" letter-spacing="-1.5">
    <tspan x="80" dy="0">Know what&#8217;s wrong</tspan>
    <tspan x="80" dy="66">before you ship.</tspan>
  </text>

  <text x="80" y="410" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" fill="#a8adb8">
    <tspan x="80" dy="0">33 checks across six categories. A score out of 100.</tspan>
    <tspan x="80" dy="34">Exactly what to fix, before it ships.</tspan>
  </text>

  <!-- Score dial, echoing the report page -->
  <g transform="translate(1000, 315)">
    <circle r="128" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
    <circle r="128" fill="none" stroke="url(#scoreRing)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="804.2" stroke-dashoffset="40" transform="rotate(-90)"/>
    <text x="0" y="-6" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="64" font-weight="600" fill="#f5f6f8">95</text>
    <text x="0" y="34" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" fill="#a8adb8" letter-spacing="2">/ 100</text>
  </g>
</svg>
