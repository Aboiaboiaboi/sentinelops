<!doctype html>
<!-- Single dark theme. `class="dark"` is static, not toggled: it keeps any
     `dark:` utility in agreement with the tokens in index.css, which are dark
     unconditionally. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b10" />
    <title>SentinelOps — Know what's wrong before you ship</title>
    <meta
      name="description"
      content="Point SentinelOps at a repository. It clones it, runs 33 checks across six categories, and hands back a score out of 100 with exactly what to fix."
    />
    <link rel="canonical" href="https://13-206-43-42.sslip.io/home" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SentinelOps" />
    <meta property="og:title" content="SentinelOps — Know what's wrong before you ship" />
    <meta
      property="og:description"
      content="Point SentinelOps at a repository. It clones it, runs 33 checks across six categories, and hands back a score out of 100 with exactly what to fix."
    />
    <meta property="og:url" content="https://13-206-43-42.sslip.io/home" />
    <meta property="og:image" content="https://13-206-43-42.sslip.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SentinelOps — Know what's wrong before you ship. Score: 95/100." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SentinelOps — Know what's wrong before you ship" />
    <meta
      name="twitter:description"
      content="Point SentinelOps at a repository. It clones it, runs 33 checks across six categories, and hands back a score out of 100 with exactly what to fix."
    />
    <meta name="twitter:image" content="https://13-206-43-42.sslip.io/og-image.png" />

    <!-- Favicon / manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Space Grotesk: headings/display. IBM Plex Sans: body. JetBrains Mono:
         scores, commit SHAs, severity labels. Weights kept tight on purpose —
         three families is already real bytes. display=swap so text is never
         invisible while these load (font-loading rule). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
