# Scraped by the prometheus container in docker-compose.observability.yml.
# 1s: sub-2-second feel on the dashboards, at the cost of ~5x the storage
# writes/scrape load of the previous 5s setting — still trivial for four
# targets with this few metrics on a mostly-idle VM. If retention math ever
# gets tight, this is the first knob to turn back up.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # backend/app/observability.py — request rate/latency, scan queue depth,
  # scan job outcomes. Reached by Compose service name over the shared
  # default network; never proxied through Caddy (frontend/Caddyfile only
  # proxies /api/*), so this is unreachable from outside the VM by
  # construction, not by convention.
  - job_name: sentinelops-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
