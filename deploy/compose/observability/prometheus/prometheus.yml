# Scraped by the prometheus container in docker-compose.observability.yml.
# 15s: frequent enough to see a scan's queue depth move in near-real-time on
# a dashboard, infrequent enough that four targets cost nothing on a small VM.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # backend/app/observability.py — request rate/latency, scan queue depth,
  # scan job outcomes. Reached by Compose service name over the shared
  # default network; never proxied through Caddy (frontend/Caddyfile only
  # proxies /api/*), so this is unreachable from outside the VM by
  # construction, not by convention.
  - job_name: sentinelops-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
