apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed rather than auto-generated, so the dashboard JSON under
    # ../dashboards/ can reference {"type": "prometheus", "uid": "prometheus"}
    # deterministically instead of looking the uid up at import time.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
