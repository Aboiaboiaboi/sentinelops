[project]
name = "sentinelops-backend"
version = "0.1.0"
description = "SentinelOps production-readiness assessment API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "bcrypt>=4.1",
    # [crypto] pulls in `cryptography` for RS256 — the GitHub App JWT is
    # asymmetric, unlike the HS256 auth cookie.
    "pyjwt[crypto]>=2.10",
    "pydantic[email]>=2.10",
    "slowapi>=0.1.9",
    "arq>=0.28",
    # A runtime dependency, not just a test client: github_app_service calls the
    # GitHub API with it. It lived in the dev group while it was only used by
    # the test suite, and stayed there when it stopped being — which built a
    # worker image (uv sync --no-dev) that crashed on import.
    "httpx>=0.28",
    # PDF reports. Chosen over WeasyPrint by measurement, not preference:
    # WeasyPrint renders the better document but needs GTK, which no lockfile
    # records and which does not import on Windows — where this suite is run
    # locally. Pure Python installs everywhere. See services/report_renderer.py.
    "fpdf2>=2.8",
    # /metrics (app/observability.py). Pure Python, no C extension, no reason
    # for an optional group the way the cloud SDKs below get one.
    "prometheus-client>=0.21",
]

[dependency-groups]
# Two cloud SDKs live in the project, and neither is a default dependency.
# `uv sync` without these groups installs nothing from Google or AWS, the suite
# passes, and LocalStorage serves development exactly as before — which is what
# keeps "no cloud SDK is required to run this" a fact rather than a slogan.
# Imported inside GcsStorage/S3Storage rather than at module scope, so absence
# is a configuration error at startup and not an ImportError halfway through a
# request.
#
# The Dockerfile installs both with --group gcs --group s3, into the one
# builder stage both images share — so the worker carries them too, without
# ever calling either. See the Dockerfile for why that is cheaper than two
# builders.
gcs = [
    "google-cloud-storage>=2.19",
]

# boto3 speaks a de facto standard rather than one vendor's API — AWS S3,
# Cloudflare R2, DigitalOcean Spaces, MinIO and GCS's own interop endpoint all
# accept it — so this group buys portability across most deployable clouds,
# not only AWS.
s3 = [
    "boto3>=1.35",
]

dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Reads text back out of a rendered report. A test that asserts on byte
    # length passes for a valid empty PDF, which is the same mistake as
    # trusting a scanner's empty output.
    "pypdf>=6.0",
]

# This is an application, not a distributable library — there is nothing to build
# or install, so uv should not look for a build backend.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Every test here is async; requiring an explicit marker on each one would be
# noise.
asyncio_mode = "auto"
# One event loop for the whole run. asyncpg connections are bound to the loop
# that created them, so a session-scoped engine handed to a function-scoped test
# on a fresh loop fails with "attached to a different loop". Per-test isolation
# comes from transaction rollback instead, which is the isolation that matters.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"
# Migration scripts are generated, and become a frozen historical record the
# moment they are applied anywhere. Reformatting them later churns files nobody
# should be editing. env.py is hand-maintained and stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
