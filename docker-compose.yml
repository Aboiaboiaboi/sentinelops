# Local development infrastructure.
#
# Only the stateful services live here for now — the API runs on the host against
# them, which keeps the edit/reload loop fast. The backend and worker get their
# own services here once there is a Dockerfile to build.
#
# Credentials below are development defaults and are meant to be boring. Nothing
# in this file is used for a deployed environment.

services:
  postgres:
    image: postgres:17-alpine
    container_name: sentinelops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelops}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are both load-bearing. Bare `pg_isready` checks as the root OS
      # user against a same-named database, so it reports ready during the window
      # where the server is up but the application role and database do not exist
      # yet — exactly the window a migration would run in and fail.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinelops} -d ${POSTGRES_DB:-sentinelops}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinelops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Redis's default save points are active in this image, so queued jobs
      # survive a restart. Not critical in dev, but it costs nothing and makes
      # local behaviour match the deployed queue.
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own short-lived service rather than from the API's
  # entrypoint. An entrypoint that migrates works until there are two API
  # replicas, at which point both race to apply the same revision on every
  # deploy. A separate one-shot job runs exactly once and the API waits for it
  # to exit successfully.
  migrate:
    build:
      context: ./backend
      # Every service names its target explicitly. Without one, Docker builds
      # the LAST stage in the file — so adding the worker stage would silently
      # have shipped git into the API and migration images too.
      target: api
    container_name: sentinelops-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      # Not localhost. Inside the compose network each service is reachable by
      # its service name, and "localhost" would mean this container itself.
      # This is the single most common thing to get wrong when moving an app
      # that worked on the host into a container.
      DATABASE_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
    depends_on:
      postgres:
        # Waits for the healthcheck to pass, not merely for the container to
        # start. Without the condition, Postgres accepting connections and
        # Postgres being ready are two different moments and the migration
        # loses the race.
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: api
    container_name: sentinelops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Generated reports survive a container rebuild. Mounted at /data, which
      # the image creates for the app user — /app itself is root-owned and not
      # writable by the process.
      - backend_data:/data
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
      # The API publishes scan jobs here; it never consumes them.
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # Optional — empty means the private-repository feature reports itself
      # unavailable rather than half-working (app/api/github.py). Not read
      # from backend/.env: Compose does not pass a container's own .env file
      # into it automatically, and backend/.dockerignore excludes it from the
      # image besides. These read from THIS file's own .env (repository root)
      # or the shell's environment, the same as every other ${VAR} above.
      # Only the API imports github_app_service — the worker never needs these.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        # Start only once migrations have finished and exited zero. A failed
        # migration therefore stops the API from coming up at all, instead of
        # serving requests against a schema it does not match.
        condition: service_completed_successfully

  # The security tools run with --network=none, so they cannot download the data
  # they need: Trivy's vulnerability database and Semgrep's rules. These two
  # short-lived services do have network, write into a shared volume, and exit.
  # The scan containers then mount that volume READ-ONLY.
  #
  # Deliberately NOT a dependency of the worker. A machine with no internet
  # would otherwise have no worker at all, when what it actually has is two
  # checks that cannot run — which the ERRORED outcome exists to say. Phase 5
  # moves this to a scheduled CI job for the same reason.
  #
  # Both run as root and finish by widening permissions, because the scan
  # containers read this volume as uid 65534 and a fresh named volume is
  # root-owned 0755 — an unreadable cache looks exactly like a missing one.
  warm-trivy:
    image: aquasec/trivy:0.72.0
    container_name: sentinelops-warm-trivy
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        trivy image --download-db-only --no-progress --cache-dir /cache &&
        chmod -R a+rX /cache
    volumes:
      - sandbox_cache:/cache

  warm-semgrep:
    image: semgrep/semgrep:1.171.0
    container_name: sentinelops-warm-semgrep
    restart: "no"
    entrypoint: ["sh", "-c"]
    # Downloaded to a temporary name, validated, and only then moved into place.
    # The move is atomic within the volume, so a scan starting mid-refresh reads
    # either the old ruleset or the new one — never half a YAML file. Semgrep
    # caches nothing itself: it re-fetches p/security-audit from the registry on
    # every run, which is exactly what an offline container cannot do.
    command:
      # The `touch /src/.keep` is not incidental. The image ships an empty /src
      # and aborts if it holds no files at all — its normal use is
      # `-v "$PWD:/src"` — and validation takes no target to satisfy that with.
      - >
        mkdir -p /cache/semgrep /src && touch /src/.keep &&
        curl -sSfL -o /cache/semgrep/.security-audit.yml.tmp
        https://semgrep.dev/c/p/security-audit &&
        semgrep scan --validate --config /cache/semgrep/.security-audit.yml.tmp
        --metrics=off --disable-version-check &&
        mv /cache/semgrep/.security-audit.yml.tmp /cache/semgrep/security-audit.yml &&
        chmod -R a+rX /cache/semgrep
    volumes:
      - sandbox_cache:/cache

  worker:
    build:
      context: ./backend
      target: worker
    container_name: sentinelops-worker
    restart: unless-stopped
    volumes:
      - worker_data:/data
      # THE DOCKER SOCKET IS ROOT ON THE HOST. Anything that can reach it can
      # start a privileged container and own this machine — the socket has no
      # concept of "only allowed to run these images". It is here so the worker
      # can start sibling containers for the security tools, and it belongs in
      # this development file and NOWHERE ELSE. Do not copy this line into a
      # deployed environment: Phase 5 replaces it with Cloud Run Jobs, which is
      # the whole reason SandboxRunner is a protocol rather than a function.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is mode 660 root:root, and the worker runs as an unprivileged
    # user — so without this it gets EACCES and every tool check reports errored.
    # Adding the app user to the root *group* is a real privilege increase, and
    # it is honest to note that it changes little: anything that can reach this
    # socket is already root-equivalent on the host. Development only, for the
    # same reason as the mount above.
    group_add:
      - "0"
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      SANDBOX_ENABLED: "true"
      # The volume name, not a path. `docker run` from inside this container is
      # served by the host daemon, so bind-mounting /data/repos/... would name a
      # path the host does not have — the tool would scan nothing and report the
      # repository clean. Mounting the same named volume gives the sibling the
      # clone at the path it already has.
      #
      # The name the HOST daemon knows, which is not `worker_data`. Compose
      # prefixes volume names with the project, and a `source=` naming a volume
      # that does not exist is created empty rather than refused — so the tool
      # would mount an empty directory instead of the clone. The volumes section
      # pins the name explicitly so this string is correct no matter what the
      # checkout directory is called.
      SANDBOX_VOLUME: sentinelops_worker_data
      # Same rule about the real name as above. Populated by the two warm
      # services; the worker logs a warning at startup if it is missing, since
      # the tools that need it will report errored until it exists.
      SANDBOX_CACHE_VOLUME: sentinelops_sandbox_cache
      # The worker's container ceiling, made explicit. The security scanner runs
      # its three tools at once and arq runs up to max_jobs scans at once, so
      # without this the containers in flight are 5 x 3 = 15 — at 512 MB each
      # that is 7.5 GB, more than a default Docker Desktop VM has.
      #
      # Six is two scans' worth of tools, chosen after measuring rather than by
      # halving the alarming number. Peaks are Semgrep 271 MiB, Gitleaks 58,
      # Trivy 39 — a limit is not a reservation, so six slots cost well under a
      # gigabyte in practice. Scans past that queue for a slot, which is cheap:
      # the three tools cost ~34 container-seconds on a 2,500-file repository.
      SANDBOX_MAX_CONCURRENT: "6"
    # No ports. The worker pulls jobs off Redis rather than accepting requests,
    # so it needs no inbound path at all — which is also why Cloud Run Worker
    # Pools exist rather than forcing this shape into a request/response service.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  backend_data:
  # Named explicitly, unlike the others. Compose would otherwise call it
  # <project>_worker_data, where the project defaults to the directory name —
  # so a clone into `sentinelops-fork/` would change the volume's real name and
  # SANDBOX_VOLUME above would silently point at nothing.
  worker_data:
    name: sentinelops_worker_data
  # Trivy's vulnerability database and Semgrep's rules. Around 1.1 GB once
  # unpacked, and rebuilt by the warm services rather than backed up — it is a
  # cache, and `docker compose down -v` is meant to be safe to run.
  sandbox_cache:
    name: sentinelops_sandbox_cache
